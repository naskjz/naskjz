<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Luan — desenvolvimento de software</title>
  <desc id="desc">Banner escuro com detalhes azuis e uma composição gráfica inspirada em código e tecnologia.</desc>
  <defs>
